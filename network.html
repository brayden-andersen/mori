<!DOCTYPE html>
<html lang="en" data-auth="required">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'inline-speculation-rules'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ovchugvbujrqkowjalfx.supabase.co https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://ovchugvbujrqkowjalfx.supabase.co wss://ovchugvbujrqkowjalfx.supabase.co; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SandBox • MORI Network</title>
  <link rel="icon" href="assets/img/mori-icon.svg?v=7" type="image/svg+xml" />
  <link rel="icon" href="assets/img/mori-icon-32.png?v=7" type="image/png" sizes="32x32" />
  <link rel="icon" href="favicon.ico?v=7" sizes="48x48" />
  <link rel="apple-touch-icon" href="assets/img/mori-icon-180.png?v=7" />
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/mori.css?v=14" />
  <link rel="stylesheet" href="assets/css/network.css?v=14" />
  <link rel="stylesheet" href="assets/css/tour.css?v=14" />
  <link rel="stylesheet" href="assets/css/dark.css?v=14" />
  <script src="assets/js/config.js?v=14"></script>
  <script src="assets/js/auth.js?v=14"></script>
  <script defer src="assets/js/data.js?v=14"></script>
  <script defer src="assets/js/state.js?v=14"></script>
  <script defer src="assets/js/ui.js?v=14"></script>
  <script defer src="assets/js/motion.js?v=14"></script>
  <script defer src="assets/js/db.js?v=14"></script>
  <script defer src="assets/js/sample.js?v=14"></script>
  <script defer src="assets/js/guestdb.js?v=14"></script>
  <script defer src="assets/js/shell.js?v=14"></script>
  <script defer src="assets/js/people.js?v=14"></script>
  <script defer src="assets/js/network.js?v=14"></script>
  <script defer src="assets/js/tour.js?v=14"></script>
</head>
<body data-page="network">
  <div class="aura" aria-hidden="true"></div>

  <!-- NAV (rendered by shell.js) -->
  <div data-shell="nav"></div>

  <main class="wrap wrap--network">
    <header class="pagehead" role="banner">
      <div>
        <nav class="crumbs" aria-label="Breadcrumb" data-reveal="fade">
          <a href="home.html">Home</a> <span class="sep">/</span> <span>MORI Network</span>
        </nav>
        <h1 class="title">MORI Network</h1>
        <p class="meta" data-reveal="fade" style="--reveal-delay:200ms">Find your people: founders and specialists who have joined Sandbox.</p>
      </div>
      <button class="btn magnetic" type="button" id="findCofounder" data-reveal="fade" style="--reveal-delay:260ms"><i class="ico" data-icon="userPlus"></i> Find a co-founder</button>
    </header>

    <div class="net-layout">
      <!-- Manage my network -->
      <aside class="panel net-manage" aria-labelledby="manageTitle">
        <h2 class="net-manage-title" id="manageTitle">Manage my network</h2>
        <nav class="manage-list" aria-label="Manage my network">
          <a class="manage-item" href="#explore" data-tab="explore"><i class="ico" data-icon="compass"></i><span>Discover</span></a>
          <a class="manage-item" href="#requests" data-tab="requests"><i class="ico" data-icon="inbox"></i><span>Requests</span><span class="manage-badge" data-badge="requests" hidden></span></a>
          <a class="manage-item" href="#messages" data-tab="messages"><i class="ico" data-icon="message"></i><span>Messages</span><span class="manage-badge" data-badge="messages" hidden></span></a>
          <a class="manage-item" href="#" data-connections><i class="ico" data-icon="network"></i><span>Connections</span><span class="manage-num" id="mConnections"></span></a>
          <a class="manage-item" href="#sent" data-tab="sent"><i class="ico" data-icon="send"></i><span>Sent requests</span><span class="manage-num" id="mSent"></span></a>
        </nav>
      </aside>

      <div class="net-main">
        <!-- ===== Discover, with requests on top ===== -->
        <div class="net-pane" data-pane="explore">
          <section class="panel net-requests" id="requestsBox" aria-labelledby="recvTitle">
            <div class="panel-head"><h3 id="recvTitle">Requests</h3><button class="link-btn" type="button" id="recvMore" hidden>Show all</button></div>
            <div class="req-list" id="recvList"></div>
          </section>

          <section class="panel explore" aria-labelledby="peopleTitle">
            <div class="panel-head"><h3 id="peopleTitle">Discover</h3></div>
            <div class="explore-top">
              <label class="search" aria-label="Search members">
                <i class="ico" data-icon="search"></i>
                <input type="search" id="peopleQ" placeholder="Search names, skills or regions…" autocomplete="off">
              </label>
            </div>

            <div class="explore-filters">
              <div class="fgroup">
                <label class="fgroup-label" for="roleSel">Role</label>
                <select class="select select--sm" id="roleSel"></select>
              </div>
              <div class="fgroup">
                <label class="fgroup-label" for="expSel">Years of experience</label>
                <select class="select select--sm" id="expSel"></select>
              </div>
              <div class="fgroup">
                <label class="fgroup-label" for="regionSel">Region</label>
                <select class="select select--sm" id="regionSel"></select>
              </div>
              <div class="fgroup">
                <label class="fgroup-label" for="ratingMin">Verified sprints</label>
                <select class="select select--sm" id="ratingMin">
                  <option value="0">Any</option>
                  <option value="1">1 or more</option>
                  <option value="3">3 or more</option>
                  <option value="5">5 or more</option>
                </select>
              </div>
              <div class="fgroup ind-filter" id="indFilter">
                <span class="fgroup-label" id="indLabel">Industry</span>
                <button class="select select--sm ind-toggle" type="button" id="indToggle" aria-expanded="false" aria-controls="indPanel" aria-describedby="indLabel">Any industry</button>
                <div class="ind-panel" id="indPanel" role="group" aria-labelledby="indLabel" hidden>
                  <label class="search search--sm" aria-label="Search industries"><i class="ico" data-icon="search"></i><input type="search" id="indQ" placeholder="Search industries" autocomplete="off"></label>
                  <ul class="ind-list" id="indList"></ul>
                </div>
              </div>
            </div>
            <div class="explore-active" id="activeFilters" hidden></div>
            <p class="meta explore-count" id="peopleCount" aria-live="polite"></p>

            <div class="grid people-grid" id="peopleGrid"></div>
            <div class="empty" id="peopleEmpty" hidden></div>
          </section>
        </div>

        <!-- ===== Sent requests ===== -->
        <div class="net-pane" data-pane="sent" hidden>
          <section class="panel" aria-labelledby="sentTitle">
            <div class="panel-head"><h3 id="sentTitle">Sent requests</h3><span class="meta" id="sentCount"></span></div>
            <div class="req-list" id="sentList"></div>
          </section>
        </div>

        <!-- ===== Messages: live chat with your connections ===== -->
        <div class="net-pane" data-pane="messages" hidden>
          <section class="panel chat" id="chat" aria-label="Conversations">
            <div class="chat-side">
              <label class="search" aria-label="Search conversations">
                <i class="ico" data-icon="search"></i>
                <input type="search" id="chatQ" placeholder="Search conversations" autocomplete="off">
              </label>
              <ul class="chat-list" id="chatList" aria-label="Conversations"></ul>
            </div>
            <div class="chat-main" id="chatMain"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div data-shell="footer"></div>
</body>
</html>
